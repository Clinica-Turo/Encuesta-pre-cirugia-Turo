<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta Pre-Cirugía · Clínica Turó</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --ink: #2B2B2B;
    --ink-soft: #6E6E6E;
    --teal: #4FB8B6;
    --teal-deep: #2E8482;
    --sand: #8C8C8C;
    --line: #E1DFDA;
    --alert: #A5432C;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  header.top{
    text-align:left;
    margin-bottom: 28px;
  }
  header.top img.logo{
    height: 46px;
    display:block;
    margin-bottom: 10px;
  }
  header.top .subtitle{
    font-size:14.5px;
    color: var(--ink-soft);
    margin-top:4px;
  }

  .progress-track{
    height:3px;
    background: var(--line);
    border-radius: 2px;
    margin: 22px 0 6px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--teal);
    transition: width .35s ease;
  }
  .progress-label{
    font-size: 12.5px;
    color: var(--ink-soft);
    display:flex;
    justify-content: space-between;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px 30px;
    margin-top: 22px;
  }
  .step-num{
    font-size: 13px;
    color: var(--sand);
    font-weight:600;
    margin-bottom: 6px;
  }
  h2.step-title{
    font-family:'Source Serif 4', serif;
    font-size: 21px;
    font-weight:600;
    margin: 0 0 18px;
    color: var(--teal-deep);
    line-height:1.35;
  }
  .hint{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: -10px 0 18px;
  }

  .field{ margin-bottom: 20px; }
  .field label{
    display:block;
    font-size: 14.5px;
    font-weight:500;
    margin-bottom: 7px;
    color: var(--ink);
  }
  .field .opts{
    font-weight:400;
    color: var(--ink-soft);
    font-size: 13px;
    display:block;
    margin-top:2px;
  }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=time], textarea{
    width:100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px;
    background: #F7F7F6;
    color: var(--ink);
  }
  input:focus, textarea:focus{
    outline: 2px solid var(--teal);
    outline-offset: 1px;
    background: #fff;
  }
  textarea{ min-height: 70px; resize: vertical; }

  .yesno{ display:flex; gap:10px; }
  .yesno button{
    flex:1;
    padding: 11px 0;
    border: 1px solid var(--line);
    background: #F7F7F6;
    border-radius: var(--radius);
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 15px;
    font-weight:500;
    color: var(--ink);
    cursor:pointer;
    transition: all .15s ease;
  }
  .yesno button:hover{ border-color: var(--teal); }
  .yesno button.active-yes{ background: var(--teal); border-color: var(--teal); color:#fff; }
  .yesno button.active-no{ background: var(--ink-soft); border-color: var(--ink-soft); color:#fff; }

  .detail-field{
    margin-top: 12px;
    display:none;
  }
  .detail-field.show{ display:block; }

  .nav-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 26px;
  }
  .btn{
    padding: 12px 22px;
    border-radius: var(--radius);
    font-family:'IBM Plex Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  .btn-primary{ background: var(--teal-deep); color:#fff; }
  .btn-primary:hover{ background: var(--teal); }
  .btn-ghost{ background:none; color: var(--ink-soft); }
  .btn-ghost:hover{ color: var(--ink); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .req-error{
    color: var(--alert);
    font-size: 13px;
    margin-top: -10px;
    margin-bottom: 16px;
    display:none;
  }
  .req-error.show{ display:block; }

  /* Review screen */
  .review-section{ margin-bottom: 22px; }
  .review-section h3{
    font-family:'Source Serif 4', serif;
    font-size: 16px;
    color: var(--teal-deep);
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .review-row{
    display:flex;
    gap: 14px;
    font-size: 14px;
    padding: 5px 0;
  }
  .review-row .rlabel{ color: var(--ink-soft); flex: 0 0 55%; }
  .review-row .rval{ flex:1; font-weight:500; }

  /* Confirmation */
  .confirm-wrap{ text-align:left; }
  .confirm-icon{
    width:42px; height:42px;
    border-radius:50%;
    background: var(--teal);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size: 22px;
    margin-bottom: 16px;
  }

  @media print{
    body{ background:#fff; }
    .no-print{ display:none !important; }
    .card{ border:none; padding:0; }
    .wrap{ max-width:100%; padding: 0 10px; }
  }

  @media (max-width: 480px){
    .card{ padding: 24px 18px; }
    .wrap{ padding: 24px 14px 60px; }
  }
</style>
</head>

const state = {
  nombre:"", rut:"", edad:"", correo:"", telefono:"", emergencia:"", peso:"", estatura:"",

  antecedentes_medicos: null, antecedentes_medicos_detalle:"",
  antecedentes_qx: null, antecedentes_qx_detalle:"",
  antecedentes_anestesia: null, antecedentes_anestesia_detalle:"",
  antecedentes_complicaciones: null, antecedentes_complicaciones_detalle:"",
  antecedentes_familiar: null, antecedentes_familiar_detalle:"",

  alergias: null, alergias_detalle:"",
  medicamentos: null, medicamentos_detalle:"",
  habitos: null, habitos_detalle:"",
  otros_antecedentes: null, otros_antecedentes_detalle:"",

  ayuno_cumple: null, ayuno_detalle:"",
  hora_solidos:"", hora_liquidos:"",

  declaracion_firma:"", declaracion_fecha:""
};

/* ---------- STEP DEFINITIONS ---------- */
// each step (page) renders one or more questions; grouped so every page shows at least 5 questions
let currentStep = 0;
let showingReview = false;
let showingConfirm = false;

function subQ(label, key, detailLabel){
  return `
    <div class="field">
      <label>${label}</label>
      ${yesNoDetailStep({key, detailLabel})}
    </div>
  `;
}

function yesNoDetailStep(opts){
  // opts: {key, title, hint, detailPlaceholder}
  return `
    <div class="field">
      <div class="yesno">
        <button type="button" onclick="setYN('${opts.key}', true)" id="${opts.key}_yes">Sí</button>
        <button type="button" onclick="setYN('${opts.key}', false)" id="${opts.key}_no">No</button>
      </div>
      <div class="req-error" id="${opts.key}_err">Por favor selecciona una opción.</div>
      <div class="detail-field" id="${opts.key}_detailWrap">
        <label>${opts.detailLabel || 'Especifique:'}</label>
        <textarea id="${opts.key}_detail" placeholder="${opts.detailPlaceholder || ''}" oninput="state['${opts.key}_detalle']=this.value"></textarea>
      </div>
    </div>
  `;
}

const steps = [
  // Página 1: datos generales (8 campos)
  {
    title: "Datos generales",
    render: () => `
      <div class="field"><label>Nombre completo</label><input type="text" id="nombre" value="${state.nombre}" oninput="state.nombre=this.value"></div>
      <div class="field"><label>RUT</label><input type="text" id="rut" value="${state.rut}" oninput="state.rut=this.value"></div>
      <div class="field"><label>Edad</label><input type="number" id="edad" value="${state.edad}" oninput="state.edad=this.value"></div>
      <div class="field"><label>Correo electrónico</label><input type="email" id="correo" value="${state.correo}" oninput="state.correo=this.value"></div>
      <div class="field"><label>Teléfono de contacto</label><input type="tel" id="telefono" value="${state.telefono}" oninput="state.telefono=this.value"></div>
      <div class="field"><label>Nombre y teléfono de contacto de emergencia</label><input type="text" id="emergencia" value="${state.emergencia}" oninput="state.emergencia=this.value"></div>
      <div class="field"><label>Peso (kg)</label><input type="number" id="peso" value="${state.peso}" oninput="state.peso=this.value"></div>
      <div class="field"><label>Estatura (cm)</label><input type="number" id="estatura" value="${state.estatura}" oninput="state.estatura=this.value"></div>
    `,
    required: () => state.nombre && state.rut && state.edad && state.telefono
  },
  // Página 2: antecedentes médicos, quirúrgicos y anestésicos (5 preguntas)
  {
    title: "Antecedentes médicos y quirúrgicos",
    render: () =>
      subQ("¿Tiene algún antecedente médico relevante? (hipertensión, diabetes, enfermedad cardíaca, enfermedad respiratoria, apnea del sueño, enfermedad renal, enfermedad hepática, enfermedad tiroidea, trastornos de la coagulación, epilepsia, reflujo gastroesofágico, u otra)", "antecedentes_medicos", "Indique cuál(es):") +
      subQ("¿Ha sido operado(a) anteriormente?", "antecedentes_qx", "Especifique:") +
      subQ("¿Ha recibido anestesia general o sedación antes?", "antecedentes_anestesia", "Especifique:") +
      subQ("¿Ha tenido complicaciones con anestesia (náuseas severas, dificultad para despertar, reacción alérgica, etc.)?", "antecedentes_complicaciones", "Especifique:") +
      subQ("¿Algún familiar directo ha tenido complicaciones graves con anestesia?", "antecedentes_familiar", "Especifique:"),
    required: () => [state.antecedentes_medicos, state.antecedentes_qx, state.antecedentes_anestesia, state.antecedentes_complicaciones, state.antecedentes_familiar].every(v => v !== null)
  },
  // Página 3: alergias, medicamentos, hábitos, otros antecedentes y ayuno (5 preguntas + 2 horas)
  {
    title: "Alergias, medicamentos, hábitos y preparación",
    render: () =>
      subQ("¿Es alérgico(a) a algún medicamento u otro? (látex, yodo o medios de contraste, alimentos, etc.)", "alergias", "Indique cuál(es):") +
      subQ("¿Toma algún medicamento de forma regular? (incluye anticoagulantes o antiagregantes como aspirina, warfarina, clopidogrel; suplementos, vitaminas o productos naturales)", "medicamentos", "Indique cuál(es), dosis y frecuencia:") +
      subQ("¿Tiene alguno de los siguientes hábitos? (fuma, consume alcohol, consume otra sustancia)", "habitos", "Indique cuál(es) y frecuencia:") +
      subQ("¿Presenta alguna de las siguientes condiciones? (posibilidad de embarazo, uso de prótesis dentales removibles/lentes de contacto/audífonos, piercings o prótesis metálicas, fiebre/tos/síntomas de resfrío en los últimos 7 días)", "otros_antecedentes", "Indique cuál(es):") +
      subQ("¿Cumple con la preparación preoperatoria indicada? (comprendió las indicaciones de ayuno, cuenta con acompañante adulto para el día de la cirugía y su traslado posterior)", "ayuno_cumple", "Si respondió No, especifique el motivo:") +
      `<div class="field"><label>Hora de última ingesta de alimentos sólidos antes de la cirugía</label><input type="time" value="${state.hora_solidos}" oninput="state.hora_solidos=this.value"></div>
       <div class="field"><label>Hora de última ingesta de líquidos antes de la cirugía</label><input type="time" value="${state.hora_liquidos}" oninput="state.hora_liquidos=this.value"></div>`,
    required: () => [state.alergias, state.medicamentos, state.habitos, state.otros_antecedentes, state.ayuno_cumple].every(v => v !== null)
  }
];

const SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz14Rb_sFxbw44YUfKPsGR9XgIKnddvSkkb4hSp9wxJvuUWChgSUBoNJC4zVG0f4U3z/exec";

function ynCombined(val, detalle){
  if(val === true) return detalle ? `Sí — ${detalle}` : "Sí";
  if(val === false) return detalle ? `No — ${detalle}` : "No";
  return "—";
}

function submitToSheet(){
  const params = new URLSearchParams();
  params.append("nombre", state.nombre);
  params.append("rut", state.rut);
  params.append("edad", state.edad);
  params.append("correo", state.correo);
  params.append("telefono", state.telefono);
  params.append("emergencia", state.emergencia);
  params.append("peso", state.peso);
  params.append("estatura", state.estatura);
  params.append("med_general", ynCombined(state.antecedentes_medicos, state.antecedentes_medicos_detalle));
  params.append("qx_previa", ynCombined(state.antecedentes_qx, state.antecedentes_qx_detalle));
  params.append("anestesia", ynCombined(state.antecedentes_anestesia, state.antecedentes_anestesia_detalle));
  params.append("complicaciones", ynCombined(state.antecedentes_complicaciones, state.antecedentes_complicaciones_detalle));
  params.append("familiar", ynCombined(state.antecedentes_familiar, state.antecedentes_familiar_detalle));
  params.append("alergias", ynCombined(state.alergias, state.alergias_detalle));
  params.append("medicamentos", ynCombined(state.medicamentos, state.medicamentos_detalle));
  params.append("habitos", ynCombined(state.habitos, state.habitos_detalle));
  params.append("otros", ynCombined(state.otros_antecedentes, state.otros_antecedentes_detalle));
  params.append("ayuno", ynCombined(state.ayuno_cumple, state.ayuno_detalle));
  params.append("hora_solidos", state.hora_solidos);
  params.append("hora_liquidos", state.hora_liquidos);
  params.append("firma", state.declaracion_firma);
  params.append("fecha", state.declaracion_fecha);

  // Apps Script tampoco deja leer la respuesta desde el navegador (CORS),
  // por eso "no-cors": el envío se hace igual, solo no confirmamos el 200 OK acá.
  fetch(SHEETS_WEBAPP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: params.toString()
  }).catch(()=>{ /* silencioso: no bloquea la experiencia del paciente */ });
}


function setYN(key, val){
  state[key] = val;
  const yesBtn = document.getElementById(key+"_yes");
  const noBtn = document.getElementById(key+"_no");
  const wrap = document.getElementById(key+"_detailWrap");
  const err = document.getElementById(key+"_err");
  yesBtn.classList.toggle("active-yes", val === true);
  noBtn.classList.toggle("active-no", val === false);
  if(err) err.classList.remove("show");
  if(val === true){ wrap.classList.add("show"); }
  else{ wrap.classList.remove("show"); state[key+"_detalle"]=""; const ta=document.getElementById(key+"_detail"); if(ta) ta.value=""; }
}

/* ---------- RENDER ENGINE ---------- */
function renderStep(){
  const host = document.getElementById("formHost");
  const s = steps[currentStep];
  const pct = Math.round(((currentStep) / steps.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `Página ${currentStep+1} de ${steps.length}`;
  document.getElementById("progressPct").textContent = pct + "%";

  host.innerHTML = `
    <div class="card">
      <div class="step-num">SECCIÓN ${currentStep+1}</div>
      <h2 class="step-title">${s.title}</h2>
      ${s.hint ? `<div class="hint">${s.hint}</div>` : ""}
      ${s.render()}
      <div class="nav-row">
        <button class="btn btn-ghost" onclick="prevStep()" ${currentStep===0 ? "disabled":""}>Atrás</button>
        <button class="btn btn-primary" onclick="nextStep()">${currentStep === steps.length-1 ? "Revisar respuestas" : "Continuar"}</button>
      </div>
    </div>
  `;

  // restore active states for yes/no if already answered
  restoreYNVisual();
}

function restoreYNVisual(){
  const s = steps[currentStep];
  const html = document.getElementById("formHost").innerHTML;
  // find keys used in this step by checking state keys with matching id existence
  document.querySelectorAll("[id$='_yes'], [id$='_no']").forEach(btn=>{
    const key = btn.id.replace(/_yes$|_no$/, "");
    if(state[key] === true){
      document.getElementById(key+"_yes")?.classList.add("active-yes");
      document.getElementById(key+"_detailWrap")?.classList.add("show");
      const ta = document.getElementById(key+"_detail");
      if(ta) ta.value = state[key+"_detalle"] || "";
    } else if(state[key] === false){
      document.getElementById(key+"_no")?.classList.add("active-no");
    }
  });
}

function validateStep(){
  const s = steps[currentStep];
  if(s.required && !s.required()){
    // mark every unanswered yes/no question on this page
    let markedAny = false;
    document.querySelectorAll("[id$='_err']").forEach(errEl=>{
      const key = errEl.id.replace(/_err$/, "");
      if(state[key] === null || state[key] === undefined){
        errEl.classList.add("show");
        markedAny = true;
      }
    });
    if(markedAny) return false;
    alert("Por favor completa los campos obligatorios antes de continuar.");
    return false;
  }
  return true;
}

function nextStep(){
  if(!validateStep()) return;
  if(currentStep < steps.length - 1){
    currentStep++;
    renderStep();
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    showReview();
  }
}
function prevStep(){
  if(currentStep > 0){
    currentStep--;
    renderStep();
    window.scrollTo({top:0, behavior:"smooth"});
  }
}
